name: Refresh reference data

# Filter curves / dust maps are effectively static, so this is a low-frequency
# backstop. Run it on demand (or after a sncosmo bump) via "Run workflow".
on:
  workflow_dispatch:
    inputs:
      include_models:
        description: "Refresh sncosmo SED model templates too (large, and pulls the families the README leaves out)"
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fetch dependencies
        run: pip install sncosmo dustmaps astropy

      # Scheduled runs skip the SED templates: they are not loaded at consumer
      # import time, and refetching them re-proposes the large families this
      # repo deliberately omits.
      - name: Refresh data
        id: refresh
        run: |
          status=0
          if [ "${{ inputs.include_models }}" = "true" ]; then
            python tools/refresh.py || status=$?
          else
            python tools/refresh.py --no-models || status=$?
          fi
          if [ "$status" -eq 2 ]; then
            echo "missing_bandpasses=1" >> "$GITHUB_OUTPUT"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Open PR if data changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes; nothing to do."
            exit 0
          fi
          # One long-lived branch, force-pushed: a per-run branch reopens an
          # identical PR every week for as long as the first one sits unmerged.
          branch="refresh/data"
          git checkout -b "$branch"
          git commit -m "Refresh vendored reference data"
          git push -f origin "$branch"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "PR already open for $branch; updated it in place."
            exit 0
          fi
          gh pr create \
            --title "Refresh vendored reference data" \
            --body "Automated refresh from \`tools/refresh.py\`. Review the changed data files before merging."

      # Deliberately after the PR step, so a missing curve still surfaces
      # whatever else was fetched instead of dropping the whole run.
      - name: Fail if bandpasses are still missing
        if: steps.refresh.outputs.missing_bandpasses == '1'
        run: |
          echo "::error::Some bandpasses could not be fetched; see the refresh step log."
          exit 1
